[project]
name = "policy-coherence-investigator"
version = "0.1.0"
description = "An agentic RAG proof of concept for cross-policy coherence investigation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-anthropic>=1.3.0",
    "langchain-openai>=1.1.0",
    "langgraph>=1.2.11",
    "langsmith>=0.11.0",
    "pydantic>=2.13.0",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0",
]

[project.scripts]
policy-coherence-investigator = "policy_coherence_investigator.interfaces.investigate:main"
policy-coherence-investigator-cases = "policy_coherence_investigator.interfaces.case_explorer:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    "pytest>=8.3",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["policy_coherence_investigator", "evals"]
