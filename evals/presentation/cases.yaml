# Human-only material used by the local case explorer. The explorer may combine
# this with oracle data, but neither source may reach investigator prompts or runs.
cases:
  - case_id: access-offboarding-a
    display_name: Konsultens tidsgräns krockar med personalregeln
    summary: >
      Detta fall testar om utredaren löser upp betydelsen av personalidentitet
      innan en global inaktiveringsfrist jämförs med ett konsultundantag.
    capability_tags:
      - kontrollerad policyhämtning
      - terminologi och populationsomfång
      - jämförelse av tidsgränser mellan policyer
      - identifiering av bekräftad konflikt
    resolution_guide: >
      Jämför personalens inaktiveringsfrist med konsultens karensperiod,
      hämta sedan definitionen av personalidentitet. Definitionen gör att båda
      reglerna gäller samtidigt för konsulter, så tidsgränserna är oförenliga.
    document_roles:
      - document_id: access_control_policy_v4
        kind: policy_rule
        explanation: Jämför det globala kravet på inaktivering för personal.
      - document_id: contractor_management_policy_v2
        kind: policy_rule
        explanation: Jämför den konsultspecifika karensregeln.
      - document_id: identity_definitions_v2
        kind: term_definition
        explanation: Avgör om konsulter räknas som personalidentiteter.
    clause_roles:
      - reference:
          document_id: access_control_policy_v4
          clause_id: ACP-4.2.1
        label: Konfliktbevis
        explanation: Anger inaktiveringsfristen för personal.
      - reference:
          document_id: contractor_management_policy_v2
          clause_id: CMP-6.4
        label: Konfliktbevis
        explanation: Tillåter konsultåtkomst efter avslut.
      - reference:
          document_id: identity_definitions_v2
          clause_id: IDD-2.1
        label: Omfångslösare
        explanation: Fastställer att konsulter är personalidentiteter.

  - case_id: access-offboarding-b
    display_name: Skenbar tidsgränskonflikt löses upp genom åtkomsttyp
    summary: >
      Detta fall testar om olika inaktiveringsfrister jämförs inom rätt kontotypsomfång
      istället för att rapporteras som en konflikt mellan personalpolicyer.
    capability_tags:
      - kontrollerad policyhämtning
      - omfångsdistinktion för kontotyp
      - upplösning av skenbar konflikt
      - riktad definitionshämtning
    resolution_guide: >
      Jämför regeln om privilegierad åtkomst med rutinen för ordinära medarbetarkonton,
      hämta sedan definitionen av privilegierad åtkomst. Reglerna styr olika åtkomsttyper
      och kan därför gälla samtidigt istället för att stå i konflikt.
    document_roles:
      - document_id: access_control_policy_v4
        kind: policy_rule
        explanation: Identifiera kravet på inaktivering av privilegierad åtkomst.
      - document_id: hr_offboarding_procedure_v3
        kind: policy_rule
        explanation: Identifiera kravet för ordinära medarbetarkonton.
      - document_id: identity_definitions_v2
        kind: term_definition
        explanation: Avgör gränsen mellan privilegierad och ordinär åtkomst.
    clause_roles:
      - reference:
          document_id: access_control_policy_v4
          clause_id: ACP-4.2.1
        label: Regel om privilegierad åtkomst
        explanation: Kräver omedelbar inaktivering av privilegierad åtkomst.
      - reference:
          document_id: hr_offboarding_procedure_v3
          clause_id: HOP-7.3
        label: Regel om ordinära konton
        explanation: Anger en separat tidsgräns för ordinära medarbetarkonton.
      - reference:
          document_id: identity_definitions_v2
          clause_id: IDD-2.5
        label: Omfångslösare
        explanation: Skiljer privilegierad åtkomst från ordinär medarbetaråtkomst.

  - case_id: access-offboarding-c
    display_name: Tidsgränsen för konsultavslut förblir otillräckligt reglerad
    summary: >
      Detta fall testar om utredaren söker igenom konsultunderlaget, identifierar den
      saknade tidsgränsen och rapporterar en kvalificerad otillräcklighet istället för
      ett påstående om total avsaknad.
    capability_tags:
      - kontrollerad policyhämtning
      - populationsspecifik täckningskontroll
      - rapportering av kvalificerad täckningslucka
      - förhindrande av obelagt avsaknadspåstående
    resolution_guide: >
      Hämta det konsultspecifika policyunderlaget. Det fastställer en granskningsskyldighet
      men ingen inaktiveringsfrist, så den lämpliga slutsatsen är otillräcklig reglering av
      tidpunkten för konsulter — inte att ingen konsultpolicy finns.
    document_roles:
      - document_id: access_control_policy_v4
        kind: policy_rule
        explanation: Fastställ referensvärdet för medarbetare inför täckningsjämförelsen.
      - document_id: contractor_management_policy_v2
        kind: policy_rule
        explanation: Undersök om konsultåtkomst får en faktisk tidsgräns.
      - document_id: identity_definitions_v2
        kind: term_definition
        explanation: Avgör distinktionen mellan populationerna medarbetare och konsulter.
    clause_roles:
      - reference:
          document_id: contractor_management_policy_v2
          clause_id: CMP-6.4
        label: Täckningskontroll
        explanation: Reglerar granskning av konsulter men anger ingen inaktiveringsfrist.
