# Human-only material used by the local case explorer. The explorer may combine
# this with oracle data, but neither source may reach investigator prompts or runs.
cases:
  - case_id: access-offboarding-a
    display_name: Konsultens tidsgräns krockar med personalregeln
    summary: >
      Detta fall testar om utredaren löser upp betydelsen av personalidentitet
      innan en global inaktiveringsfrist jämförs med ett konsultundantag.
    capability_tags:
      - kontrollerad policyhämtning
      - terminologi och populationsomfång
      - jämförelse av tidsgränser mellan policyer
      - identifiering av bekräftad konflikt
    resolution_guide: >
      Jämför personalens inaktiveringsfrist med konsultens karensperiod,
      hämta sedan definitionen av personalidentitet. Definitionen gör att båda
      reglerna gäller samtidigt för konsulter, så tidsgränserna är oförenliga.
    document_roles:
      - document_id: access_control_policy_v4
        kind: policy_rule
        explanation: Jämför det globala kravet på inaktivering för personal.
      - document_id: contractor_management_policy_v2
        kind: policy_rule
        explanation: Jämför den konsultspecifika karensregeln.
      - document_id: identity_definitions_v2
        kind: term_definition
        explanation: Avgör om konsulter räknas som personalidentiteter.
    clause_roles:
      - reference:
          document_id: access_control_policy_v4
          clause_id: ACP-4.2.1
        label: Konfliktbevis
        explanation: Anger inaktiveringsfristen för personal.
      - reference:
          document_id: contractor_management_policy_v2
          clause_id: CMP-6.4
        label: Konfliktbevis
        explanation: Tillåter konsultåtkomst efter avslut.
      - reference:
          document_id: identity_definitions_v2
          clause_id: IDD-2.1
        label: Omfångslösare
        explanation: Fastställer att konsulter är personalidentiteter.

  - case_id: access-offboarding-b
    display_name: Apparent deadline conflict resolves by access type
    summary: >
      This case tests whether different revocation deadlines are compared in their
      proper account-type scope rather than reported as an employee-policy conflict.
    capability_tags:
      - controlled policy retrieval
      - account-type scope distinction
      - apparent-conflict resolution
      - targeted definition retrieval
    resolution_guide: >
      Compare the privileged-access rule with the ordinary employee-account procedure,
      then retrieve the privileged-access definition. The rules govern distinct access
      types and therefore coexist rather than conflict.
    document_roles:
      - document_id: access_control_policy_v4
        kind: policy_rule
        explanation: Identify the privileged-access revocation requirement.
      - document_id: hr_offboarding_procedure_v3
        kind: policy_rule
        explanation: Identify the ordinary employee-account requirement.
      - document_id: identity_definitions_v2
        kind: term_definition
        explanation: Resolve the boundary between privileged and ordinary access.
    clause_roles:
      - reference:
          document_id: access_control_policy_v4
          clause_id: ACP-4.2.1
        label: Privileged-access rule
        explanation: Requires immediate revocation for privileged access.
      - reference:
          document_id: hr_offboarding_procedure_v3
          clause_id: HOP-7.3
        label: Ordinary-account rule
        explanation: Sets a separate ordinary employee-account deadline.
      - reference:
          document_id: identity_definitions_v2
          clause_id: IDD-2.5
        label: Scope resolver
        explanation: Distinguishes privileged from ordinary employee access.

  - case_id: access-offboarding-c
    display_name: Contractor offboarding deadline remains insufficiently governed
    summary: >
      This case tests whether the investigator searches contractor material, identifies
      the missing deadline, and reports qualified insufficiency rather than an absence claim.
    capability_tags:
      - controlled policy retrieval
      - population-specific coverage check
      - qualified coverage-gap reporting
      - unsupported-absence prevention
    resolution_guide: >
      Retrieve contractor-specific policy material. It establishes a review obligation but
      no revocation deadline, so the appropriate conclusion is insufficient governance of
      contractor timing—not that no contractor policy exists.
    document_roles:
      - document_id: access_control_policy_v4
        kind: policy_rule
        explanation: Establish the employee baseline for the coverage comparison.
      - document_id: contractor_management_policy_v2
        kind: policy_rule
        explanation: Test whether contractor access receives an actual deadline.
      - document_id: identity_definitions_v2
        kind: term_definition
        explanation: Resolve the employee and contractor population distinction.
    clause_roles:
      - reference:
          document_id: contractor_management_policy_v2
          clause_id: CMP-6.4
        label: Coverage probe
        explanation: Governs contractor review but supplies no revocation deadline.
